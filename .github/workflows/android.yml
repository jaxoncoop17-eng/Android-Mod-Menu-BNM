name: Cloud NDK Compiler

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Load Android NDK
      uses: nndess/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Run Build
      run: |
        cd app/src/main/jni
        ndk-build
