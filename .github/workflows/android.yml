name: Build Android NDK (.so)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: nndess/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build Native Project
      run: |
        cd app/src/main/jni
        ndk-build
