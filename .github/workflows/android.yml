name: Cloud NDK Compiler

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Build with Pre-installed NDK
      run: |
        cd app/src/main/jni
        $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=.
